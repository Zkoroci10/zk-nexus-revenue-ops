<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0D1117" />
        <stop offset="50%" stop-color="#161B22" />
        <stop offset="100%" stop-color="#090D12" />
      </linearGradient>
      
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1C2128" />
        <stop offset="100%" stop-color="#161B22" />
      </linearGradient>

      <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#238636" />
        <stop offset="100%" stop-color="#2EA043" />
      </linearGradient>

      <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#1F6FEE" />
        <stop offset="100%" stop-color="#58A6FF" />
      </linearGradient>

      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#B08000" />
        <stop offset="100%" stop-color="#D29922" />
      </linearGradient>

      <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262D" stroke-width="1" opacity="0.6"/>
      </pattern>

      <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="15" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="15" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <style>
        .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; }
        .body-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; }
        .mono-text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-weight: 700; }
      </style>
    </defs>
  
  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />
  <rect width="1920" height="1080" fill="url(#gridPattern)" />
  
  <!-- Glow Accent Spots -->
  <circle cx="200" cy="200" r="300" fill="#2EA043" opacity="0.12" filter="url(#glowEmerald)"/>
  <circle cx="1700" cy="850" r="350" fill="#58A6FF" opacity="0.1" filter="url(#glowCyan)"/>

  <!-- Top Brand Navigation Ribbon -->
  <rect x="0" y="0" width="1920" height="60" fill="#161B22" opacity="0.9"/>
  <line x1="0" y1="60" x2="1920" y2="60" stroke="#30363D" stroke-width="1"/>
  <circle cx="60" cy="30" r="10" fill="#2EA043"/>
  <text x="80" y="36" fill="#F0F6FC" class="mono-text" font-size="16" letter-spacing="2">ZK NEXUS REVOPS PLATFORM</text>
  <text x="400" y="36" fill="#6E7681" class="body-text" font-size="16">|</text>
  <text x="420" y="36" fill="#58A6FF" class="mono-text" font-size="15">OFFICIAL WHATSAPP BUSINESS DIRECTORY &amp; REVOPS ENGINE</text>

  <!-- Left Main Container Card -->
  <rect x="80" y="110" width="1120" height="910" rx="20" fill="url(#cardGrad)" stroke="#30363D" stroke-width="2"/>
  
  <!-- Category Pill Badge -->
  <rect x="130" y="160" width="380" height="42" rx="21" fill="url(#emeraldGrad)"/>
  <text x="320" y="186" fill="#FFFFFF" class="mono-text" font-size="15" text-anchor="middle" letter-spacing="1">B2B REAL ESTATE REVOPS ENGINE</text>

  <!-- Main Headline & Subtitle -->
  <text x="130" y="270" fill="#F0F6FC" class="title-text" font-size="58">ZK NEXUS PLATFORM</text>
  <text x="130" y="325" fill="#58A6FF" class="title-text" font-size="28">Autonomous WhatsApp SDR &amp; High-Volume Lead Pipeline</text>
  <text x="130" y="365" fill="#8B949E" class="body-text" font-size="20">Empowering Solo Negotiators, Top Teams, and Enterprise Agencies across Malaysia.</text>

  <!-- Key Value Pillars (Checklist Cards) -->
  <g transform="translate(130, 410)">
    <!-- Pillar 1 -->
    <rect x="0" y="0" width="1020" height="85" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
    <circle cx="45" cy="42" r="18" fill="#2EA043" opacity="0.2"/>
    <path d="M 37 42 L 43 48 L 54 36" fill="none" stroke="#2EA043" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="38" fill="#F0F6FC" class="title-text" font-size="20">AI Lead Parser &amp; Instant DSR Qualification</text>
    <text x="80" y="64" fill="#8B949E" class="body-text" font-size="15">Extracts buyer budget, location preferences, and automatically calculates debt-service capability in real time.</text>

    <!-- Pillar 2 -->
    <rect x="0" y="105" width="1020" height="85" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
    <circle cx="45" cy="147" r="18" fill="#58A6FF" opacity="0.2"/>
    <path d="M 37 147 L 43 153 L 54 141" fill="none" stroke="#58A6FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="143" fill="#F0F6FC" class="title-text" font-size="20">Dynamic Multi-Agent Round-Robin Allocation</text>
    <text x="80" y="169" fill="#8B949E" class="body-text" font-size="15">Zero-delay lead distribution for 1-5 REN teams with speed-to-lead SLA tracking under 2 minutes.</text>

    <!-- Pillar 3 -->
    <rect x="0" y="210" width="1020" height="85" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
    <circle cx="45" cy="252" r="18" fill="#D29922" opacity="0.2"/>
    <path d="M 37 252 L 43 258 L 54 246" fill="none" stroke="#D29922" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="248" fill="#F0F6FC" class="title-text" font-size="20">Enterprise WhatsApp Cloud API &amp; Dedicated Infrastructure</text>
    <text x="80" y="274" fill="#8B949E" class="body-text" font-size="15">High-concurrency query handling supporting massive 100,000+ lead databases with sub-50ms latency.</text>
  </g>

  <!-- Stat Counter Boxes (Bottom of Left Card) -->
  <g transform="translate(130, 745)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="320" height="200" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
    <text x="30" y="70" fill="#58A6FF" class="mono-text" font-size="44">100k+</text>
    <text x="30" y="110" fill="#F0F6FC" class="title-text" font-size="18">Lead Scale</text>
    <text x="30" y="140" fill="#8B949E" class="body-text" font-size="14">Enterprise DB capacity</text>

    <!-- Stat 2 -->
    <rect x="350" y="0" width="320" height="200" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
    <text x="380" y="70" fill="#2EA043" class="mono-text" font-size="44">&lt;50ms</text>
    <text x="380" y="110" fill="#F0F6FC" class="title-text" font-size="18">Query Latency</text>
    <text x="380" y="140" fill="#8B949E" class="body-text" font-size="14">Instant response engine</text>

    <!-- Stat 3 -->
    <rect x="700" y="0" width="320" height="200" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
    <text x="730" y="70" fill="#D29922" class="mono-text" font-size="44">100%</text>
    <text x="730" y="110" fill="#F0F6FC" class="title-text" font-size="18">PDPA 2010</text>
    <text x="730" y="140" fill="#8B949E" class="body-text" font-size="14">Malaysian Data Compliance</text>
  </g>

  <!-- Right Side Column -->
  <!-- 1. Founder Badge Card -->
  <g transform="translate(1240, 110)">
    <rect x="0" y="0" width="600" height="435" rx="20" fill="url(#cardGrad)" stroke="#30363D" stroke-width="2"/>
    
    <text x="40" y="55" fill="#6E7681" class="mono-text" font-size="14" letter-spacing="2">LEADERSHIP &amp; FOUNDER</text>
    
    <!-- Founder Avatar Visual Circle -->
    <circle cx="110" cy="165" r="55" fill="#0D1117" stroke="#2EA043" stroke-width="3" filter="url(#glowEmerald)"/>
    <circle cx="110" cy="165" r="48" fill="url(#emeraldGrad)"/>
    <text x="110" y="177" fill="#FFFFFF" class="title-text" font-size="36" text-anchor="middle">ZA</text>
    <circle cx="148" cy="202" r="14" fill="#2EA043"/>
    <path d="M 142 202 L 146 206 L 154 198" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Founder Info -->
    <text x="190" y="145" fill="#F0F6FC" class="title-text" font-size="30">Zubair Ariff</text>
    <text x="190" y="175" fill="#2EA043" class="mono-text" font-size="16">FOUNDER &amp; CHIEF ARCHITECT</text>
    <text x="190" y="202" fill="#8B949E" class="body-text" font-size="15">ZK Nexus RevOps Engineering</text>

    <!-- Bio / Badge Statement -->
    <rect x="40" y="250" width="520" height="145" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
    <text x="65" y="288" fill="#F0F6FC" class="body-text" font-size="16" font-style="italic">"We built ZK Nexus to empower Malaysian real estate</text>
    <text x="65" y="315" fill="#F0F6FC" class="body-text" font-size="16" font-style="italic">professionals with enterprise-grade autonomous SDR</text>
    <text x="65" y="342" fill="#F0F6FC" class="body-text" font-size="16" font-style="italic">tools, instant DSR qualification, &amp; 100% compliance."</text>
    
    <rect x="360" y="352" width="180" height="28" rx="14" fill="#161B22" stroke="#2EA043" stroke-width="1"/>
    <text x="450" y="371" fill="#2EA043" class="mono-text" font-size="12" text-anchor="middle">AUTHENTIC BADGE</text>
  </g>

  <!-- 2. PDPA Compliance & Trust Seal Card -->
  <g transform="translate(1240, 585)">
    <rect x="0" y="0" width="600" height="435" rx="20" fill="url(#cardGrad)" stroke="#30363D" stroke-width="2"/>
    
    <text x="40" y="55" fill="#6E7681" class="mono-text" font-size="14" letter-spacing="2">DATA GOVERNANCE &amp; SECURITY</text>

    <!-- Shield Graphic -->
    <g transform="translate(40, 85)">
      <rect x="0" y="0" width="520" height="150" rx="14" fill="#0D1117" stroke="#2EA043" stroke-width="1.5"/>
      <path d="M 60 40 L 90 25 L 120 40 C 120 80 90 105 90 105 C 90 105 60 80 60 40 Z" fill="url(#emeraldGrad)" opacity="0.9"/>
      <path d="M 80 62 L 87 69 L 100 56" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

      <text x="145" y="58" fill="#F0F6FC" class="title-text" font-size="22">100% PDPA 2010 ALIGNMENT SEAL</text>
      <text x="145" y="88" fill="#2EA043" class="mono-text" font-size="14">MALAYSIA PERSONAL DATA PROTECTION ACT</text>
      <text x="145" y="115" fill="#8B949E" class="body-text" font-size="14">Strict consent tracking, encrypted data storage &amp; audit trails.</text>
    </g>

    <!-- Feature Grid inside Trust Card -->
    <g transform="translate(40, 260)">
      <rect x="0" y="0" width="245" height="135" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="20" y="45" fill="#58A6FF" class="mono-text" font-size="16">AES-256 BIT</text>
      <text x="20" y="75" fill="#F0F6FC" class="title-text" font-size="16">Data Encryption</text>
      <text x="20" y="102" fill="#6E7681" class="body-text" font-size="13">At rest &amp; in transit</text>

      <rect x="275" y="0" width="245" height="135" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="295" y="45" fill="#D29922" class="mono-text" font-size="16">24/7 MONITORING</text>
      <text x="295" y="75" fill="#F0F6FC" class="title-text" font-size="16">Audit Log System</text>
      <text x="295" y="102" fill="#6E7681" class="body-text" font-size="13">Real-time threat check</text>
    </g>
  </g>
</svg>