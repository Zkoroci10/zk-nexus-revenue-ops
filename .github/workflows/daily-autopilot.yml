name: ZK-Nexus 24-7 Cloud Autopilot Engine

on:
  schedule:
    # Runs at 01:00 UTC (09:00 AM Malaysia Time) every single day
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub UI

jobs:
  cloud-autopilot:
    name: 24/7 Cloud Execution & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ZK-Nexus Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12 Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Run ZNS Master System Audit
        run: |
          python 05_Systems/Scripts/validate_zns.py --workspace-root .

      - name: Verify JSON Feed Integrity
        run: |
          python -c "import json; data=json.load(open('05_Systems/Console-Portal/public/dossiers.json')); print(f'Dossier Feed Active: {len(data.get(\"dossiers\", []))} dossiers verified.')"
